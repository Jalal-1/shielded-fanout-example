# The proof server this app proves with. Start it with `pnpm proof:up`.
#
# Whoever runs the proof server sees the private inputs of every proof, so run
# your own. A payout to N recipients needs N+1 proofs at once, and the server
# refuses work beyond its job capacity (the default is 10), so the capacity is
# raised here. Set PROOF_SERVER_PORT if 6300 is taken, and point the app at it
# with VITE_PROOF_SERVER_URL (see .env.example).
services:
  proof-server:
    image: 'midnightntwrk/proof-server:9.0.2'
    command: ['midnight-proof-server', '--job-capacity', '1024', '--num-workers', '${PROOF_SERVER_WORKERS:-4}']
    ports:
      - '127.0.0.1:${PROOF_SERVER_PORT:-6300}:6300'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
